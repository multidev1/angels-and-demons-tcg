<title>Reset Password | Angels & Demons TCG</title>

<link rel="stylesheet" href="style.css">

<style>

        max-width: 500px;

    }

        width: 100%;

```
<div class="reset-container">

    <h1>RESET PASSWORD</h1>

    <div id="loading">
        <p>Checking your password reset link...</p>
    </div>

    <div id="reset-form" class="hidden">

        <p>
            Enter your new password below.
        </p>

        <input
            type="password"
            id="new-password"
            placeholder="New password"
            autocomplete="new-password"
        >

        <input
            type="password"
            id="confirm-password"
            placeholder="Confirm new password"
            autocomplete="new-password"
        >

        <button id="reset-button">
            RESET PASSWORD
        </button>

        <div id="message"></div>

    </div>

    <div id="error-message" class="hidden"></div>

    <div id="success-message" class="hidden">

        <p>
            Your password has been successfully reset.
        </p>

        <a
            class="back-link"
            href="account.html"
        >
            GO TO ACCOUNT
        </a>

    </div>

</div>


<script type="module">

    import {
        initializeApp
    } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

    import {
        getAuth,
        verifyPasswordResetCode,
        confirmPasswordReset
    } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";


    const firebaseConfig = {

        apiKey: "AIzaSyC8SYGuCnamD8EXHppwDfx3Px4kFREy68Q",

        authDomain:
            "angels-and-demons-tcg.firebaseapp.com",

        projectId:
            "angels-and-demons-tcg",

        storageBucket:
            "angels-and-demons-tcg.firebasestorage.app",

        messagingSenderId:
            "824060828922",

        appId:
            "1:824060828922:web:ad0c0c4f5bf978a738aa3d43",

        measurementId:
            "G-LT9RPTDKCE"

    };


    const app =
        initializeApp(firebaseConfig);

    const auth =
        getAuth(app);


    const params =
        new URLSearchParams(
            window.location.search
        );


    const mode =
        params.get("mode");

    const actionCode =
        params.get("oobCode");

    const continueUrl =
        params.get("continueUrl");


    const loading =
        document.getElementById("loading");

    const resetForm =
        document.getElementById("reset-form");

    const errorMessage =
        document.getElementById("error-message");

    const successMessage =
        document.getElementById("success-message");

    const newPassword =
        document.getElementById("new-password");

    const confirmPassword =
        document.getElementById("confirm-password");

    const resetButton =
        document.getElementById("reset-button");

    const message =
        document.getElementById("message");


    let accountEmail = null;


    function showError(text) {

        loading.classList.add("hidden");

        resetForm.classList.add("hidden");

        successMessage.classList.add("hidden");

        errorMessage.textContent = text;

        errorMessage.classList.remove("hidden");

    }


    /*
     * Check that this is actually
     * a password-reset request.
     */

    if (
        mode !== "resetPassword" ||
        !actionCode
    ) {

        showError(
            "This password reset link is invalid."
        );

    } else {

        /*
         * Verify the one-time Firebase
         * password reset code.
         */

        verifyPasswordResetCode(
            auth,
            actionCode
        )
        .then((email) => {

            accountEmail = email;

            loading.classList.add("hidden");

            resetForm.classList.remove("hidden");

        })
        .catch((error) => {

            console.error(
                "Password reset verification error:",
                error
            );

            let text =
                "This password reset link is invalid or has expired.";

            if (
                error.code ===
                "auth/expired-action-code"
            ) {

                text =
                    "This password reset link has expired. Please request a new password reset email.";

            }

            if (
                error.code ===
                "auth/invalid-action-code"
            ) {

                text =
                    "This password reset link is invalid or has already been used. Please request a new password reset email.";

            }

            showError(text);

        });

    }


    resetButton.addEventListener(
        "click",
        async () => {

            const password =
                newPassword.value;

            const confirmation =
                confirmPassword.value;


            message.textContent = "";


            if (!password) {

                message.textContent =
                    "Please enter a new password.";

                return;

            }


            if (password.length < 6) {

                message.textContent =
                    "Password must be at least 6 characters.";

                return;

            }


            if (
                password !== confirmation
            ) {

                message.textContent =
                    "The passwords do not match.";

                return;

            }


            resetButton.disabled = true;

            resetButton.textContent =
                "RESETTING...";


            try {

                await confirmPasswordReset(
                    auth,
                    actionCode,
                    password
                );


                resetForm.classList.add("hidden");

                errorMessage.classList.add("hidden");

                successMessage.classList.remove("hidden");


            } catch (error) {

                console.error(
                    "Password reset error:",
                    error
                );


                if (
                    error.code ===
                    "auth/expired-action-code"
                ) {

                    showError(
                        "This password reset link has expired. Please request a new password reset email."
                    );

                } else if (
                    error.code ===
                    "auth/invalid-action-code"
                ) {

                    showError(
                        "This password reset link is invalid or has already been used."
                    );

                } else if (
                    error.code ===
                    "auth/weak-password"
                ) {

                    message.textContent =
                        "This password is too weak. Please choose a stronger password.";

                    resetButton.disabled = false;

                    resetButton.textContent =
                        "RESET PASSWORD";

                } else {

                    message.textContent =
                        "Something went wrong. Please try again.";

                    resetButton.disabled = false;

                    resetButton.textContent =
                        "RESET PASSWORD";

                }

            }

        }
    );

</script>
